[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lungai"
version = "0.1.0"
description = "Chest X-ray pneumonia classification with CNNs"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lingesh S" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
